<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holofeed</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.svg" type="image/svg">
</head>
<body>
    <h1>
        <img src="Printed-Circuit.png" alt="">
        <span class="title">Holofeed</span>
    </h1>
    <form id="new-post-form" class="form">
        <label for="post-body">Message:</label>
        <textarea type="text" name="body" id="post-body" rows="5"></textarea>
        <label for="post-user">Username:</label>
        <input type="text" name="user" id="post-user">
        <button type="submit">
            <span>POST</span>
        </button>
    </form>
    <ul id="all-posts"></ul>
</body>
</html>
